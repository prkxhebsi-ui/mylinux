# MyLinux ARM64 boot protocol configuration
# Target: Samsung Galaxy Tab A 8.0 (SM-T295)
# Codename: gto
#
# Initial planning template only.
# This is not an official Linux boot-protocol definition.

[architecture]
name=arm64
endianness=little
image_format=Image

[entry]
entry_point=linux_arm64_entry
entry_point_status=unverified

[boot_requirements]
cpu_state=verify_before_boot
exception_level=verify_before_boot
interrupts=verify_before_boot
mmu=verify_before_boot
device_tree=required
initramfs=optional
kernel_command_line=required

[device]
model=SM-T295
codename=gto
bootloader_version=T295XXS6CWG2
boot_chain_status=unverified

[security]
android_verified_boot=enabled_on_stock_device
custom_image_acceptance=unverified

[build]
compiler=clang
assembler=clang
linker=ld.lld
output=Image
