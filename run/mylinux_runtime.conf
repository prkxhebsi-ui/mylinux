# MyLinux Runtime Configuration
# Status: DEVELOPMENT TEMPLATE
# Runtime data should be recreated at boot.

[Runtime]
Name=MyLinux Runtime
Version=0.1.0
Root=/run/mylinux
CreateOnBoot=yes
ClearStaleState=yes

[Directories]
StateDirectory=/run/mylinux
PidDirectory=/run/mylinux/pids
SocketDirectory=/run/mylinux/sockets
LockDirectory=/run/mylinux/locks
JournalDirectory=/run/mylinux/journal
ServiceDirectory=/run/mylinux/services
WatchdogDirectory=/run/mylinux/watchdog
TimerDirectory=/run/mylinux/timers
SessionDirectory=/run/mylinux/sessions

[Permissions]
DirectoryMode=0755
PidFileMode=0644
SocketMode=0660
LockFileMode=0600

[Limits]
MaxPidFiles=1024
MaxSockets=256
MaxLockFiles=512

[Cleanup]
RemoveStalePidFiles=yes
RemoveStaleSockets=yes
RemoveExpiredLocks=yes
PreserveJournal=no

[Security]
FollowSymlinks=no
AllowUnregisteredServices=no
ExecuteCommands=no

[Status]
Complete=no
RuntimeSetupImplemented=no
