# MyLinux system startup configuration

MYLINUX_HOSTNAME="mylinux-gto"
MYLINUX_LOG_LEVEL="info"

# Startup services
MYLINUX_ENABLE_LOGGING="yes"
MYLINUX_ENABLE_NETWORKING="yes"
MYLINUX_ENABLE_SSH="no"

# Console
MYLINUX_CONSOLE="ttyMSM0"
MYLINUX_CONSOLE_BAUD="115200"

# Filesystems
MYLINUX_MOUNT_PROC="yes"
MYLINUX_MOUNT_SYS="yes"
MYLINUX_MOUNT_DEV="yes"

# This file is configuration only.
# An init/rc implementation must parse and apply these values.
