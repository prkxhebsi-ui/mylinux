# MyLinux Manager Daemon Configuration
# Status: INCOMPLETE — DEVELOPMENT
# Target: Samsung SM-T295 (gto), ARM64

[Manager]
Name=MyLinux Manager
Version=0.1.0
Mode=development

[Logging]
Level=info
Output=stderr
IncludeTimestamp=yes
IncludeProcessId=yes

[Process]
MaxTrackedProcesses=1024
DefaultRestartPolicy=on-failure
RestartDelayMs=1000
ShutdownTimeoutSec=30

[Resources]
MaxOpenFiles=4096
MaxServices=256
MaxDependencies=64

[Security]
AllowShellCommands=no
AllowUnknownServices=no
RequireAbsoluteExecutablePath=yes

[Runtime]
StateDirectory=/run/mylinux-managerd
ConfigurationDirectory=/etc/mylinux
ServiceDirectory=/etc/mylinux/services

[Compatibility]
AndroidInitRcSupport=metadata-only
SystemdUnitSupport=planned

[Status]
Complete=no
StartsServices=no
ExecutesCommands=no
