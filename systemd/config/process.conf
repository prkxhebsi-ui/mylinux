[Process]
Name=MyLinux Process Supervisor
Enabled=yes
MaxTrackedProcesses=1024
PollIntervalMs=500

[Restart]
DefaultPolicy=on-failure
RestartDelayMs=1000
MaxRestartAttempts=5
RestartWindowSec=60

[Limits]
MaxOpenFiles=4096
MaxProcesses=1024

[Security]
TrackOnlyRegisteredChildren=yes
ExecuteShellCommands=no
