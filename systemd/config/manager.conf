[Manager]
Name=MyLinux Manager
Version=0.1.0
Mode=development
ConfigFile=/etc/mylinux/managerd.conf
MaxServices=256
MaxTrackedProcesses=1024

[Runtime]
StateDirectory=/run/mylinux
PidFile=/run/mylinux/managerd.pid

[Security]
AllowShellCommands=no
RequireAbsoluteExecutablePath=yes

[Status]
Enabled=yes
StartServices=no
ExecuteCommands=no
