# MyLinux systemd configuration
# Status: INCOMPLETE — DEVELOPMENT TEMPLATE
# Target: Samsung Galaxy Tab A 8.0 (SM-T295 / gto)

[Manager]
LogLevel=info
LogTarget=journal
LogColor=no
LogLocation=no

# Runtime directories
RuntimeWatchdogSec=0
ShutdownWatchdogSec=10min

# Resource limits
DefaultLimitNOFILE=4096:8192
DefaultLimitNPROC=1024:2048
DefaultTasksMax=75%

# Time and locale
Timezone=Asia/Dhaka
Locale=en_US.UTF-8

# System behavior
ConfirmSpawn=no
CrashShell=no
ShowStatus=yes

# Security
DumpCore=no
DefaultOOMPolicy=stop

# MyLinux development status
# This file is not yet validated by systemd.
# It does not start services by itself.
